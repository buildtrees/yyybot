<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">yyybot 当前类结构与运行流程</title>
  <desc id="desc">展示 WorkspaceManager、SessionManager、ConversationContext、Agent、Model、Provider、ToolRegistry 和 AgentResult 之间的数据流。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .lane-title { font: 700 19px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; letter-spacing: 1px; }
      .node-title { font: 700 20px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-text { font: 400 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 500 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .edge-label { font: 600 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .blue-card { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; filter: url(#shadow); }
      .green-card { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; filter: url(#shadow); }
      .amber-card { fill: #fffbeb; stroke: #fbbf24; stroke-width: 2; filter: url(#shadow); }
      .violet-card { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; filter: url(#shadow); }
      .rose-card { fill: #fff1f2; stroke: #fb7185; stroke-width: 2; filter: url(#shadow); }
      .lane { fill: #ffffff; fill-opacity: .48; stroke: #dbeafe; stroke-width: 1.5; stroke-dasharray: 8 8; }
      .line { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 2.8; marker-end: url(#arrow-blue); }
      .dash-line { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1420" fill="url(#background)"/>
  <text x="70" y="62" class="title">yyybot 当前类结构与运行流程</text>
  <text x="70" y="94" class="subtitle">Workspace/会话加载、模型工具循环与完整 AgentResult</text>

  <!-- Workspace, session, and context lane -->
  <rect x="55" y="125" width="1690" height="225" rx="26" class="lane"/>
  <text x="82" y="158" class="lane-title">01  WORKSPACE、会话与上下文</text>

  <rect x="70" y="180" width="240" height="130" rx="18" class="green-card"/>
  <text x="190" y="218" text-anchor="middle" class="node-title">WorkspaceManager</text>
  <text x="190" y="248" text-anchor="middle" class="node-text">create · list · load</text>
  <text x="190" y="278" text-anchor="middle" class="small">~/.yyybot/workspaces</text>
  <rect x="355" y="195" width="195" height="100" rx="18" class="violet-card"/>
  <text x="452" y="233" text-anchor="middle" class="node-title">Workspace</text>
  <text x="452" y="263" text-anchor="middle" class="node-text">数据隔离边界</text>
  <rect x="595" y="180" width="250" height="130" rx="18" class="green-card"/>
  <text x="720" y="218" text-anchor="middle" class="node-title">SessionManager</text>
  <text x="720" y="248" text-anchor="middle" class="node-text">load · append_turn</text>
  <text x="720" y="278" text-anchor="middle" class="small">sessions/</text>
  <rect x="890" y="195" width="195" height="100" rx="18" class="amber-card"/>
  <text x="987" y="233" text-anchor="middle" class="node-title">Session JSONL</text>
  <text x="987" y="263" text-anchor="middle" class="node-text">每会话一个文件</text>
  <rect x="1130" y="180" width="300" height="130" rx="18" class="card"/>
  <text x="1280" y="218" text-anchor="middle" class="node-title">ConversationContext</text>
  <text x="1280" y="248" text-anchor="middle" class="node-text">system prompt + history</text>
  <text x="1280" y="278" text-anchor="middle" class="node-text">build · record · clear</text>
  <rect x="1475" y="195" width="250" height="100" rx="18" class="blue-card"/>
  <text x="1600" y="233" text-anchor="middle" class="node-title">模型输入</text>
  <text x="1600" y="263" text-anchor="middle" class="node-text">Messages</text>

  <path d="M310 245 H355" class="line"/>
  <path d="M550 245 H595" class="line"/>
  <path d="M845 220 H890" class="line"/>
  <path d="M890 275 H845" class="line"/>
  <path d="M845 295 V330 H1280 V310" class="blue-line"/>
  <text x="1035" y="318" text-anchor="middle" class="edge-label">load context</text>
  <path d="M1430 245 H1475" class="blue-line"/>

  <!-- Runtime lane -->
  <rect x="55" y="385" width="1690" height="445" rx="26" class="lane"/>
  <text x="82" y="420" class="lane-title">02  AGENT 与模型调用</text>

  <rect x="95" y="478" width="235" height="105" rx="18" class="green-card"/>
  <text x="212" y="518" text-anchor="middle" class="node-title">Agent.run</text>
  <text x="212" y="547" text-anchor="middle" class="node-text">控制模型/工具循环</text>

  <rect x="420" y="478" width="225" height="105" rx="18" class="card"/>
  <text x="532" y="518" text-anchor="middle" class="node-title">Model</text>
  <text x="532" y="547" text-anchor="middle" class="node-text">模型 ID + 生成参数</text>

  <rect x="740" y="463" width="265" height="135" rx="18" class="violet-card"/>
  <text x="872" y="505" text-anchor="middle" class="node-title">Provider</text>
  <text x="872" y="535" text-anchor="middle" class="node-text">统一 complete() 边界</text>
  <text x="872" y="565" text-anchor="middle" class="small">OpenAI · Anthropic</text>
  <text x="872" y="587" text-anchor="middle" class="small">Ollama · vLLM</text>

  <rect x="1100" y="478" width="230" height="105" rx="18" class="card"/>
  <text x="1215" y="518" text-anchor="middle" class="node-title">模型 SDK / API</text>
  <text x="1215" y="547" text-anchor="middle" class="node-text">平台原始请求与响应</text>

  <rect x="1425" y="463" width="265" height="135" rx="18" class="blue-card"/>
  <text x="1557" y="505" text-anchor="middle" class="node-title">ModelResponse</text>
  <text x="1557" y="535" text-anchor="middle" class="node-text">message · finish_reason</text>
  <text x="1557" y="565" text-anchor="middle" class="node-text">本轮 usage</text>

  <path d="M1600 295 V440 H212 V478" class="blue-line"/>
  <path d="M330 530 H420" class="line"/>
  <text x="375" y="517" text-anchor="middle" class="edge-label">complete</text>
  <path d="M645 530 H740" class="line"/>
  <path d="M1005 530 H1100" class="line"/>
  <path d="M1330 530 H1425" class="line"/>
  <path d="M1557 598 V670 H1180" class="blue-line"/>

  <polygon points="1040,670 1180,745 1040,820 900,745" class="amber-card"/>
  <text x="1040" y="739" text-anchor="middle" class="node-title">包含 ToolCall？</text>
  <text x="1040" y="766" text-anchor="middle" class="node-text">检查 assistant message</text>

  <rect x="1400" y="685" width="290" height="120" rx="18" class="rose-card"/>
  <text x="1545" y="725" text-anchor="middle" class="node-title">AgentEvent</text>
  <text x="1545" y="755" text-anchor="middle" class="node-text">model_start / model_end</text>
  <text x="1545" y="782" text-anchor="middle" class="node-text">tool_start / tool_end</text>
  <path d="M330 557 C700 625,1180 625,1400 725" class="dash-line"/>
  <text x="1365" y="693" text-anchor="end" class="edge-label">事件</text>

  <!-- Tool lane -->
  <rect x="55" y="865" width="1690" height="250" rx="26" class="lane"/>
  <text x="82" y="900" class="lane-title">03  工具分支（存在 ToolCall 时）</text>

  <rect x="135" y="945" width="245" height="105" rx="18" class="amber-card"/>
  <text x="257" y="985" text-anchor="middle" class="node-title">ToolRegistry</text>
  <text x="257" y="1014" text-anchor="middle" class="node-text">按名称查找并执行</text>

  <rect x="485" y="945" width="210" height="105" rx="18" class="card"/>
  <text x="590" y="985" text-anchor="middle" class="node-title">Tool</text>
  <text x="590" y="1014" text-anchor="middle" class="node-text">ToolSpec + Handler</text>

  <rect x="800" y="930" width="265" height="135" rx="18" class="card"/>
  <text x="932" y="972" text-anchor="middle" class="node-title">工具 Handler</text>
  <text x="932" y="1002" text-anchor="middle" class="node-text">同步函数或异步函数</text>
  <text x="932" y="1032" text-anchor="middle" class="small">bash · web_search · web_fetch</text>

  <rect x="1170" y="945" width="250" height="105" rx="18" class="green-card"/>
  <text x="1295" y="985" text-anchor="middle" class="node-title">Tool Message</text>
  <text x="1295" y="1014" text-anchor="middle" class="node-text">ok/result 或 error</text>

  <path d="M900 745 H257 V945" class="blue-line"/>
  <text x="605" y="730" text-anchor="middle" class="edge-label">是</text>
  <path d="M380 997 H485" class="line"/>
  <path d="M695 997 H800" class="line"/>
  <path d="M1065 997 H1170" class="line"/>
  <path d="M1420 997 H1605 V630 H532 V583" class="blue-line"/>
  <text x="1590" y="850" text-anchor="end" class="edge-label">追加消息并进入下一模型轮次</text>

  <!-- Result lane -->
  <rect x="55" y="1150" width="1690" height="220" rx="26" class="lane"/>
  <text x="82" y="1185" class="lane-title">04  完整运行结果（无 ToolCall 时）</text>

  <rect x="100" y="1225" width="250" height="100" rx="18" class="green-card"/>
  <text x="225" y="1265" text-anchor="middle" class="node-title">AgentResult</text>
  <text x="225" y="1294" text-anchor="middle" class="node-text">一次运行的完整记录</text>

  <rect x="430" y="1215" width="235" height="120" rx="18" class="card"/>
  <text x="547" y="1252" text-anchor="middle" class="node-title">最终输出</text>
  <text x="547" y="1282" text-anchor="middle" class="node-text">final_message</text>
  <text x="547" y="1308" text-anchor="middle" class="node-text">output</text>

  <rect x="735" y="1215" width="235" height="120" rx="18" class="card"/>
  <text x="852" y="1252" text-anchor="middle" class="node-title">完整轨迹</text>
  <text x="852" y="1282" text-anchor="middle" class="node-text">messages</text>
  <text x="852" y="1308" text-anchor="middle" class="node-text">含 ToolCall / Tool 结果</text>

  <rect x="1040" y="1215" width="235" height="120" rx="18" class="card"/>
  <text x="1157" y="1252" text-anchor="middle" class="node-title">逐轮响应</text>
  <text x="1157" y="1282" text-anchor="middle" class="node-text">responses</text>
  <text x="1157" y="1308" text-anchor="middle" class="node-text">model_turns</text>

  <rect x="1345" y="1215" width="300" height="120" rx="18" class="blue-card"/>
  <text x="1495" y="1252" text-anchor="middle" class="node-title">Token 统计</text>
  <text x="1495" y="1282" text-anchor="middle" class="node-text">usage_by_turn</text>
  <text x="1495" y="1308" text-anchor="middle" class="node-text">usage 汇总</text>

  <path d="M1040 820 V1125 H225 V1225" class="blue-line"/>
  <text x="1021" y="854" text-anchor="end" class="edge-label">否</text>
  <path d="M350 1275 H430" class="line"/>
  <path d="M350 1275 C390 1165,690 1165,735 1275" class="line"/>
  <path d="M350 1275 C500 1125,980 1125,1040 1275" class="line"/>
  <path d="M350 1275 C650 1095,1275 1095,1345 1275" class="line"/>

  <text x="70" y="1400" class="small">实线：数据与调用流　　虚线：事件通知　　Workspace 隔离数据，SessionManager 加载 JSONL，ConversationContext 组装上下文</text>
</svg>
